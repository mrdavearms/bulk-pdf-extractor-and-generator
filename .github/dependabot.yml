version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    # PyMuPDF 2 adds onnxruntime and pymupdf4llm as hard dependencies
    # (see requirements.txt). Remove this once that is acceptable.
    ignore:
      - dependency-name: "PyMuPDF"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
